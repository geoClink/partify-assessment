<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>Partify Parts Finder</title>
    </head>

    <body>
        <main>
            <div>
                <form>
                    <label for="year">Year</label>
                    <select id="year"><option>Select Year</option></select>
                    <label for="make">Make</label>
                     <select id="make"><option>Select Make</option></select>
                    <label for="model">Model</label>
                     <select id="model"><option>Select Model</option></select>
                    <label for="product-type">Product Type</label>
                     <select id="product-type"><option>Select Product Type</option></select>
                     <button type="submit">Submit</button>
                </form>
            </div>
        </main>
    </body>
</html>
